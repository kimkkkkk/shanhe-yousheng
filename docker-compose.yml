services:
  shanhe:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 正式部署时写成你的域名，例如 shanhe.example.com
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
